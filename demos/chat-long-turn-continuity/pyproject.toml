[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlink-continuity-demo"
version = "0.1.1"
description = "Small, explicit, durable chat-job execution primitives (public demonstration)"
readme = "PUBLIC_ENGINE.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AgentLink contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
