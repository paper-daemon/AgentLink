name: CSV Doctor tests

on:
  push:
    paths:
      - 'tools/csv-doctor/**'
      - '.github/workflows/csv-doctor-tests.yml'
  pull_request:
    paths:
      - 'tools/csv-doctor/**'
      - '.github/workflows/csv-doctor-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/csv-doctor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_csv_doctor.py
