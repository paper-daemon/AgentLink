name: CSV Doctor tests

on:
  push:
    paths:
      - 'tools/csv-doctor/**'
      - '.github/workflows/csv-doctor-tests.yml'
  pull_request:
    paths:
      - 'tools/csv-doctor/**'
      - '.github/workflows/csv-doctor-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/csv-doctor
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_csv_doctor.py
