name: User Bus Doctor tests

on:
  push:
    paths:
      - "tools/user_bus_doctor.py"
      - "tools/test_user_bus_doctor.py"
      - ".github/workflows/user-bus-doctor-tests.yml"
  pull_request:
    paths:
      - "tools/user_bus_doctor.py"
      - "tools/test_user_bus_doctor.py"
      - ".github/workflows/user-bus-doctor-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: cd tools && python -m unittest -v test_user_bus_doctor.py
