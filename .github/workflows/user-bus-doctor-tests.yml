name: User Bus Doctor tests

on:
  push:
    paths:
      - "tools/user_bus_doctor.py"
      - "tools/test_user_bus_doctor.py"
      - ".github/workflows/user-bus-doctor-tests.yml"
  pull_request:
    paths:
      - "tools/user_bus_doctor.py"
      - "tools/test_user_bus_doctor.py"
      - ".github/workflows/user-bus-doctor-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: cd tools && python -m unittest -v test_user_bus_doctor.py
