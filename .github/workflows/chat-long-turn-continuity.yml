name: Chat long-turn continuity demo

on:
  push:
    paths:
      - 'demos/chat-long-turn-continuity/**'
      - '.github/workflows/chat-long-turn-continuity.yml'
  pull_request:
    paths:
      - 'demos/chat-long-turn-continuity/**'
      - '.github/workflows/chat-long-turn-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install public continuity library
        working-directory: demos/chat-long-turn-continuity
        run: python3 -m pip install -e .
      - name: Run installed library example
        working-directory: demos/chat-long-turn-continuity
        run: python3 examples/hello_engine.py
      - name: Run fresh-process continuity story
        working-directory: demos/chat-long-turn-continuity
        run: python3 run_demo.py
      - name: Run continuity regression tests
        working-directory: demos/chat-long-turn-continuity
        run: python3 -m unittest -v test_continuity_demo.py test_inspect_checkpoint.py test_public_engine.py
