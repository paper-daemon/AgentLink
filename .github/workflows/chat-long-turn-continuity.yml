name: Chat long-turn continuity demo

on:
  push:
    paths:
      - 'demos/chat-long-turn-continuity/**'
      - '.github/workflows/chat-long-turn-continuity.yml'
  pull_request:
    paths:
      - 'demos/chat-long-turn-continuity/**'
      - '.github/workflows/chat-long-turn-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public continuity library
        working-directory: demos/chat-long-turn-continuity
        run: python3 -m pip install -e .
      - name: Run installed library example
        working-directory: demos/chat-long-turn-continuity
        run: python3 examples/hello_engine.py
      - name: Run fresh-process continuity story
        working-directory: demos/chat-long-turn-continuity
        run: python3 run_demo.py
      - name: Run continuity regression tests
        working-directory: demos/chat-long-turn-continuity
        run: python3 -m unittest -v test_continuity_demo.py test_inspect_checkpoint.py test_public_engine.py test_security_hardening.py test_integrity_multiprocess.py test_json_checkpoint_safety.py test_provider_readback.py
