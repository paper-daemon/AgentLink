name: URL contract check tests

on:
  push:
    paths:
      - "tools/url_contract_check.py"
      - "tests/test_url_contract_check.py"
      - ".github/workflows/url-contract-check-tests.yml"
  pull_request:
    paths:
      - "tools/url_contract_check.py"
      - "tests/test_url_contract_check.py"
      - ".github/workflows/url-contract-check-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run URL contract tests
        run: pytest -q tests/test_url_contract_check.py
