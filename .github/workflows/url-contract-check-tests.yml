name: URL contract check tests

on:
  push:
    paths:
      - "tools/url_contract_check.py"
      - "tests/test_url_contract_check.py"
      - ".github/workflows/url-contract-check-tests.yml"
  pull_request:
    paths:
      - "tools/url_contract_check.py"
      - "tests/test_url_contract_check.py"
      - ".github/workflows/url-contract-check-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run URL contract tests
        run: pytest -q tests/test_url_contract_check.py
