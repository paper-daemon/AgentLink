name: Full-history secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Gitleaks (history or change range)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan using pinned Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Verify scanner checksum and scan every fetched Git ref
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$temp_dir/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          printf '%s  %s\n' \
            '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' \
            "$temp_dir/gitleaks.tgz" | sha256sum --check --status
          tar -xzf "$temp_dir/gitleaks.tgz" -C "$temp_dir" gitleaks
          chmod 700 "$temp_dir/gitleaks"
          set +e
          "$temp_dir/gitleaks" git --redact --no-banner --log-level=error \
            --log-opts="--all --full-history" --exit-code=42 .
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 42 ]; then
            echo '::error::Potential secret in Git history. Investigate privately and rotate affected credentials.'
            exit 1
          elif [ "$exit_code" -ne 0 ]; then
            echo "::error::Full-history secret scanner could not complete (exit $exit_code)."
            exit "$exit_code"
          fi
          echo 'Verified full-history scan passed for all fetched refs.'
