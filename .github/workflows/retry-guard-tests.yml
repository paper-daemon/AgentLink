name: Retry Guard tests

on:
  push:
    paths:
      - 'tools/retry_guard.py'
      - 'tools/test_retry_guard.py'
      - '.github/workflows/retry-guard-tests.yml'
  pull_request:
    paths:
      - 'tools/retry_guard.py'
      - 'tools/test_retry_guard.py'
      - '.github/workflows/retry-guard-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run unit tests
        working-directory: tools
        run: python -m unittest -v test_retry_guard.py
