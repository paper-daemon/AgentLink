name: Retry Guard tests

on:
  push:
    paths:
      - 'tools/retry_guard.py'
      - 'tools/test_retry_guard.py'
      - '.github/workflows/retry-guard-tests.yml'
  pull_request:
    paths:
      - 'tools/retry_guard.py'
      - 'tools/test_retry_guard.py'
      - '.github/workflows/retry-guard-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run unit tests
        working-directory: tools
        run: python -m unittest -v test_retry_guard.py
