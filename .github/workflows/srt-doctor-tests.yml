name: SRT Doctor tests

on:
  push:
    paths:
      - 'tools/srt_doctor.py'
      - 'tools/test_srt_doctor.py'
      - 'tools/README.md'
      - '.github/workflows/srt-doctor-tests.yml'
  pull_request:
    paths:
      - 'tools/srt_doctor.py'
      - 'tools/test_srt_doctor.py'
      - 'tools/README.md'
      - '.github/workflows/srt-doctor-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        working-directory: tools
        run: python -m unittest -v test_srt_doctor.py
