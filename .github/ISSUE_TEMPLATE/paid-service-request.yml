name: Paid service request
description: Request a non-confidential AgentLink review, audit, or PoC
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in AgentLink. Please share only non-confidential information here. Do not post credentials, API keys, personal data, proprietary datasets, private URLs, contracts, or security-sensitive details.
  - type: dropdown
    id: service
    attributes:
      label: Service
      options:
        - AI Automation Opportunity Scan (¥2,980 fixed)
        - AI Agent / RAG Architecture Quick Audit (¥9,800 fixed)
        - Agent Reliability & Recovery Review (¥14,800 fixed)
        - AI Automation / Small PoC Starter (¥29,800 fixed)
        - Working Python / API / RAG PoC (reference ¥59,800)
        - Multi-step AI Agent / RAG PoC (reference ¥98,000)
        - Enterprise design-partner PoC
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to improve or build?
      description: Keep this high level and non-confidential.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Current tools / data sources
      description: Names of products or general data types are enough. Do not include credentials, customer data, or private URLs.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline or urgency
  - type: textarea
    id: constraints
    attributes:
      label: Security / deployment constraints
      description: Describe constraints at a high level. Do not disclose secret architecture, credentials, or private endpoints.
  - type: checkboxes
    id: consent
    attributes:
      label: Safety check
      options:
        - label: I confirm this issue contains no credentials, secrets, private customer data, contracts, or other confidential information.
          required: true
